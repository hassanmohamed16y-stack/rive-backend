version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rive-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/rive_backend?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-key}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
    depends_on:
      - db
    command: sh -c "npx prisma db push && npm run prisma:seed && node dist/main.js"

  db:
    image: postgres:16-alpine
    container_name: rive-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rive_backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
